[project]
name = "freecad-mcp"
version = "7.1.0"
description = "MCP server to control FreeCAD from Claude"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Brian L Wong", email = "blw@blw.net" },
]
keywords = [
    "freecad", "cad", "3d-modeling", "parametric", "cam", "cnc",
    "mcp", "model-context-protocol", "claude", "ai",
]
classifiers = [
    "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "mcp-events>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/blwfish/freecad-mcp"
Repository = "https://github.com/blwfish/freecad-mcp"
Issues = "https://github.com/blwfish/freecad-mcp/issues"

[dependency-groups]
dev = ["pytest>=9.1.1", "pip-audit>=2.10.1", "pytest-cov>=7.1.0"]

[tool.uv]
# This repo ships as flat scripts + the AICopilot addon (no console-script
# entry point, no packages= layout) -- it's never been an installable
# package. `uv sync` would otherwise try to build/install it as one and hit
# setuptools' flat-layout ambiguity (helpers/fixtures/AICopilot all look like
# top-level packages). package = false tells uv to just resolve and sync the
# declared dependencies, matching how this project has always actually been
# run (`python3 freecad_mcp_server.py`, not `pip install -e .`).
package = false

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = [
    "cam: requires FreeCAD 1.2-dev (CAM/Path workbench)",
    "real_document: exercises a real, complex .FCStd fixture -- slower/heavier than the rest of the suite; run on PR, not every push",
]

# Coverage is a floor-check, not a quality gate — deliberately not wired
# into the default pytest run above; invoke explicitly at release-gate
# cadence: `venv/bin/pytest --cov --cov-report=term-missing`. /full-review's
# Phase 3.5 detects this config and runs it the same way.
[tool.coverage.run]
source = ["."]
omit = ["tests/*", "venv/*", "*/__pycache__/*", "actions-runner*/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
skip_empty = true
