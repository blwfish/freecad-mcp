name: Bisect CAM Crash

# One-off diagnostic workflow, not part of normal CI (workflow_dispatch
# only). Downloads a single specified FreeCAD weekly AppImage and runs just
# the CAM tool-creation tests against it, to binary-search which weekly
# build between weekly-2026.04.01 (known good) and weekly-2026.07.15
# (known broken) introduced the create_tool SIGSEGV documented in
# KNOWN_ISSUES.md. See that file for the crash's own background.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "FreeCAD weekly release tag to test (e.g. weekly-2026.06.03)"
        required: true
        type: string

jobs:
  bisect:
    runs-on: ubuntu-latest
    name: "Bisect ${{ inputs.tag }}"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest pytest-timeout

      - name: Download FreeCAD AppImage
        run: |
          mkdir -p ~/freecad-appimage
          cd ~/freecad-appimage
          gh release download "$TAG" \
            --repo FreeCAD/FreeCAD \
            --pattern '*Linux-x86_64.AppImage' \
            --pattern '*Linux-x86_64.AppImage-SHA256.txt' \
            --dir .
          APPIMAGE=$(ls *Linux-x86_64.AppImage | head -1)
          sha256sum -c "${APPIMAGE}-SHA256.txt"
          chmod +x "$APPIMAGE"
          "./$APPIMAGE" --appimage-extract
          rm "$APPIMAGE"
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}

      - name: Set up FreeCAD environment
        run: |
          SQUASHFS="$HOME/freecad-appimage/squashfs-root"
          printf '#!/bin/bash\nexec "%s/AppRun" freecadcmd "$@"\n' "$SQUASHFS" \
            > ~/freecad-appimage/freecadcmd-wrapper.sh
          chmod +x ~/freecad-appimage/freecadcmd-wrapper.sh
          ln -sfn "${{ github.workspace }}/AICopilot" "$SQUASHFS/usr/Mod/AICopilot"
          echo "FREECAD_MCP_FREECAD_BIN=$HOME/freecad-appimage/freecadcmd-wrapper.sh" >> "$GITHUB_ENV"
          echo "FREECAD_MCP_MODULE_DIR=${{ github.workspace }}/AICopilot" >> "$GITHUB_ENV"

      # Cheap, no live crash-test needed (KNOWN_ISSUES.md's expat symbol
      # collision root cause): does this build's libCoin.so.80 export a
      # colliding XML_ParseBuffer symbol at all? If a build crashes but
      # this comes back empty, the regression is in FreeCAD's own code
      # newly calling xml.etree.ElementTree somewhere, not in Coin's build.
      - name: Check libCoin.so.80 for a colliding XML_ParseBuffer export
        run: |
          LIBCOIN=$(find "$HOME/freecad-appimage/squashfs-root" -maxdepth 4 -name 'libCoin.so*' | head -1)
          echo "libCoin: ${LIBCOIN:-<not found>}"
          if [ -n "$LIBCOIN" ]; then
            nm -D "$LIBCOIN" 2>/dev/null | grep -i XML_Parse || echo "No XML_Parse* symbols exported by this libCoin."
          fi

      - name: Run CAM tool-creation tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_cam_workflows.py::TestCAMToolCreation -v --timeout=60 2>&1 | tee pytest-output.log
        timeout-minutes: 5
