name: Publish Docker Image

on:
  # Triggers directly on the tag push (same trigger as release.yml), not on
  # release.yml's `release: published` event: that event is created via
  # softprops/action-gh-release using the default GITHUB_TOKEN, and GitHub
  # doesn't cascade workflow triggers off GITHUB_TOKEN-authored events. This
  # sidesteps that entirely by watching the tag push itself.
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to push (default: latest)'
        required: false
        default: 'latest'

permissions:
  contents: read
  packages: write
  issues: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image tags
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="${{ inputs.tag }}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tags=ghcr.io/blwfish/freecad-mcp:${VERSION},ghcr.io/blwfish/freecad-mcp:latest" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Docker publish failed for ${context.ref}`,
              body: `The docker-publish workflow failed and did not push an updated image to ghcr.io.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug']
            })
