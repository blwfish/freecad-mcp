name: Documentation freshness check

on:
  push:
    branches: [main, dev, rewrite-core]
  pull_request:
    branches: [main]

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need parent commit for diff

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install mcp-agent-notes@git+https://github.com/blwfish/mcp-agent-notes.git@dd83adf8bb97755f91dbfcf857dbaeb987883f8f

      - name: Verify agent-notes critical-rules docs are in sync
        run: |
          python scripts/sync_agent_notes_docs.py
          if ! git diff --exit-code; then
            echo ""
            echo "::error::AGENT-INSTALL.md's Critical Rules section is out of sync with usage_guidance.NOTES."
            echo "Run 'python scripts/sync_agent_notes_docs.py' locally and commit the result."
            exit 1
          fi

      - name: Check if tool files changed without TOOLS.md update
        run: |
          # Get changed files vs parent commit
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")

          # Check if any tool-related files changed
          TOOL_CHANGES=$(echo "$CHANGED" | grep -E '^(freecad_mcp_server\.py|AICopilot/freecad_mcp_handler\.py|AICopilot/handlers/)' || true)

          if [ -n "$TOOL_CHANGES" ]; then
            echo "Tool files changed:"
            echo "$TOOL_CHANGES"

            # Check if TOOLS.md was also updated
            TOOLS_CHANGED=$(echo "$CHANGED" | grep '^TOOLS.md$' || true)
            README_CHANGED=$(echo "$CHANGED" | grep '^README.md$' || true)

            if [ -z "$TOOLS_CHANGED" ] && [ -z "$README_CHANGED" ]; then
              echo ""
              echo "::warning::Tool files changed but neither TOOLS.md nor README.md were updated. If you added, removed, or renamed tools, please update the docs."
            fi
          else
            echo "No tool file changes detected."
          fi

      - name: Verify tool count consistency
        run: |
          BRIDGE=$(grep -c 'types\.Tool(' freecad_mcp_server.py)
          DOCS=$(grep -cP '^\| `\w+`' TOOLS.md)
          echo "Bridge: $BRIDGE tools, TOOLS.md: $DOCS rows"
          if [ "$BRIDGE" != "$DOCS" ]; then
            echo "::error::Bridge defines $BRIDGE tools but TOOLS.md has $DOCS rows"
            exit 1
          fi
