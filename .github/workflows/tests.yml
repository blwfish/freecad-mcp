name: Unit Tests

on:
  push:
    branches: [main, dev, rewrite-core]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps (from lockfile)
        run: uv sync --frozen --group dev

      - name: Run unit tests
        run: uv run python -m pytest tests/unit/ -v

  all-tests-pass:
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - name: All matrix jobs passed
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "One or more test matrix jobs failed"
            exit 1
          fi
