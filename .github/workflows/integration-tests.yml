name: Integration Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  integration:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - slot: "1.1-stable"
            tag: "1.1.1"
            appimage: "FreeCAD_1.1.1-Linux-x86_64-py311.AppImage"
            pytest_args: "-m 'not cam'"
          - slot: "dev-weekly"
            tag: "weekly-2026.07.15"
            appimage: ""  # resolved by glob below
            pytest_args: ""

    name: "FreeCAD ${{ matrix.slot }}"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest pytest-timeout

      - name: Cache FreeCAD AppImage
        id: cache-freecad
        uses: actions/cache@v4
        with:
          path: ~/freecad-appimage
          key: freecad-${{ matrix.tag }}-x86_64

      - name: Download FreeCAD AppImage
        if: steps.cache-freecad.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/freecad-appimage
          cd ~/freecad-appimage

          if [ -n "${{ matrix.appimage }}" ]; then
            # Stable release — exact filename known
            gh release download "${{ matrix.tag }}" \
              --repo FreeCAD/FreeCAD \
              --pattern "${{ matrix.appimage }}" \
              --dir .
            APPIMAGE="${{ matrix.appimage }}"
          else
            # Weekly build — glob + checksum
            gh release download "${{ matrix.tag }}" \
              --repo FreeCAD/FreeCAD \
              --pattern '*Linux-x86_64.AppImage' \
              --pattern '*Linux-x86_64.AppImage-SHA256.txt' \
              --dir .
            APPIMAGE=$(ls *Linux-x86_64.AppImage | head -1)
            sha256sum -c "${APPIMAGE}-SHA256.txt"
          fi

          chmod +x "$APPIMAGE"
          "./$APPIMAGE" --appimage-extract
          rm "$APPIMAGE"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up FreeCAD environment
        run: |
          SQUASHFS="$HOME/freecad-appimage/squashfs-root"

          printf '#!/bin/bash\nexec "%s/AppRun" freecadcmd "$@"\n' "$SQUASHFS" \
            > ~/freecad-appimage/freecadcmd-wrapper.sh
          chmod +x ~/freecad-appimage/freecadcmd-wrapper.sh

          ln -sfn "${{ github.workspace }}/AICopilot" "$SQUASHFS/usr/Mod/AICopilot"

          echo "FREECAD_MCP_FREECAD_BIN=$HOME/freecad-appimage/freecadcmd-wrapper.sh" >> "$GITHUB_ENV"
          echo "FREECAD_MCP_MODULE_DIR=${{ github.workspace }}/AICopilot" >> "$GITHUB_ENV"

      - name: Enable core dumps
        run: |
          # Bypass apport (which intercepts core_pattern by default on
          # ubuntu-latest and would swallow the dump into its own report
          # format) so a plain `core` file lands in the crashing process's
          # cwd -- the spawned FreeCAD subprocess inherits this repo
          # checkout as its cwd (tests/integration/conftest.py's
          # _spawn_headless doesn't set cwd=), so cores land at
          # ${{ github.workspace }}/core.
          sudo sysctl -w kernel.core_pattern=core
          echo "core_pattern: $(cat /proc/sys/kernel/core_pattern)"

      - name: Install gdb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdb

      - name: Run integration tests
        shell: bash
        run: |
          ulimit -c unlimited
          set -o pipefail
          python -m pytest tests/integration/ -v -rs --timeout=120 ${{ matrix.pytest_args }} 2>&1 | tee pytest-output.log
          exit_code=$?
          # tests/integration/conftest.py's freecad_instance fixture is a
          # session-scoped autouse fixture that pytest.skip()s on any
          # _spawn_headless() failure (binary missing, socket never ready,
          # wrong env var) — every test in the run inherits that skip, and
          # a run where 100% of tests skip still exits 0. That would let a
          # broken FreeCAD-AppImage download (or any other spawn-
          # infrastructure failure) silently turn "run the integration
          # suite" into "run nothing" while reporting green. Fail explicitly
          # instead: a run that exits 0 but reports no passing tests earned
          # no actual confidence and must not be treated as success.
          if [ "$exit_code" -eq 0 ] && ! grep -qE '[0-9]+ passed' pytest-output.log; then
            echo "::error::Integration tests exited 0 but reported no passing tests (likely all skipped — see freecad_instance fixture in tests/integration/conftest.py). Treating this as a failure so a broken FreeCAD spawn doesn't silently mask as green CI."
            exit 1
          fi
          exit $exit_code
        timeout-minutes: 5

      - name: Capture crash backtrace
        if: always()
        run: |
          CORE_FILE="${{ github.workspace }}/core"
          if [ ! -f "$CORE_FILE" ]; then
            echo "No core file at $CORE_FILE — searching workspace and /tmp."
            CORE_FILE=$(find "${{ github.workspace }}" /tmp -maxdepth 2 -name 'core' -o -name 'core.*' 2>/dev/null | head -1)
          fi
          if [ -z "$CORE_FILE" ] || [ ! -f "$CORE_FILE" ]; then
            echo "No core dump found — nothing to analyze this run."
            exit 0
          fi
          echo "Found core dump: $CORE_FILE ($(stat -c%s "$CORE_FILE") bytes)"

          SQUASHFS="$HOME/freecad-appimage/squashfs-root"
          FREECAD_BIN=$(find "$SQUASHFS/usr/bin" -maxdepth 1 -type f -executable -iname '*freecad*' 2>/dev/null | head -1)
          if [ -z "$FREECAD_BIN" ]; then
            FREECAD_BIN=$(find "$SQUASHFS" -maxdepth 3 -type f -executable -iname '*freecad*cmd*' 2>/dev/null | head -1)
          fi
          echo "Using binary: ${FREECAD_BIN:-<not found>}"
          if [ -z "$FREECAD_BIN" ]; then
            echo "Could not locate the FreeCAD binary inside $SQUASHFS — listing usr/bin instead:"
            ls -la "$SQUASHFS/usr/bin" 2>/dev/null || echo "  ($SQUASHFS/usr/bin doesn't exist)"
            exit 0
          fi

          gdb -batch \
            -ex "info sharedlibrary" \
            -ex "thread apply all bt full" \
            -ex "quit" \
            "$FREECAD_BIN" "$CORE_FILE" 2>&1 | tee gdb-backtrace.txt || true
        timeout-minutes: 3
